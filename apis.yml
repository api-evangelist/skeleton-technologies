aid: skeleton-technologies
name: Skeleton Technologies
description: >-
  Skeleton Technologies is an Estonian-German energy storage manufacturer, founded in Tartu,
  Estonia in 2009 by Oliver Ahlberg and Taavi Madiberk, that designs and builds high-power
  supercapacitor and SuperBattery systems on its patented Curved Graphene material. Its product
  line spans SkelCap ultracapacitor cells, supercapacitor modules, and the GrapheneUPS,
  GrapheneGPU and GrapheneBBU power systems aimed at AI data centers, grid stability, defense,
  automotive, heavy transportation and industrial customers. The company has raised close to
  EUR 400 million, counts Marubeni and Siemens among its backers, and manufactures at its
  ISO 9001 / ISO 14001 certified Leipzig Superfactory in Germany, a Varkaus facility in Finland
  and a Curved Graphene plant in Bitterfeld-Wolfen. Skeleton sells physical power hardware; it
  operates no public developer program, API, SDK or machine-readable contract.
